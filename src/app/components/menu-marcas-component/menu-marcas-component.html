<div class="marcas-container">

  <!-- Título -->
  <h2 class="marcas-titulo">
    Marcas de cubos
  </h2>

  <!-- Lista de marcas -->
  <ul class="marcas-lista">

    <li *ngFor="let marca of marcas">
      <button
        class="marca-boton"
        (click)="seleccionarMarca(marca)">

        {{marca}}

      </button>
    </li>

  </ul>

</div>
