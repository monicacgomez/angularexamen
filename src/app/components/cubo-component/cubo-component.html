  <div class = "bg-white rounded-lg shadow-md p-4 border border-gray-200">
    
    <!-- Imagen del cubo -->
    <img [src]="cubo.imagen" [alt]="cubo.nombre" class="w-full h-48 object-contain">
    
    <!-- Nombre -->
    <h2 class="text-xl font-bold text-gray-800 mt-3">
      {{cubo.nombre}}
    </h2>

    <!-- Info -->
    <p class="text-gray-600 mt-2"> 
      Modelo: {{cubo.modelo}}
    </p>

    <p class="text-gray-600"> 
      Marca: {{cubo.marca}}
    </p>

    <p class="text-gray-600">  
      Color: {{cubo.color}}
    </p>

    <!-- Precio -->
    <p class="text-blue-700 font-bold text-lg mt-3"> 
      {{cubo.precio}} € 
    </p>

  </div>
