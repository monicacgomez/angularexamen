<div class="tienda-container">

  <!-- Título principal -->
  <h1 class="tienda-titulo">
    Tienda de cubos de Rubik
  </h1>

  <!-- Bienvenida -->
  <p class="tienda-descripcion">
    Bienvenido a nuestra tienda de cubos de Rubik,
    ¡encuentra tu favorito!
  </p>

  <!-- Menú de marcas -->
  <div class="menu-marcas" id="marcas">
    <app-menu-marcas-component
      (marcaSeleccionada)="seleccionarMarca($event)">
    </app-menu-marcas-component>
  </div>

  <!-- Catálogo de cubos -->
  <div class="catalogo-cubos" id="catalogo">

    <div *ngFor="let cubo of cubos; let i = index">
      <app-cubo-component 
      [cubo]="cubo"
      
    (favoritoSeleccionado)="seleccionarFavorito($event)">
      </app-cubo-component>
    </div>

  </div>

</div>
