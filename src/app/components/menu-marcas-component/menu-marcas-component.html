<div>
    <h2> Marcas de cubos </h2>
    <ul>
        <li *ngFor="let marca of marcas">
            <button class="bg-blue-600text-white px-4 py-2 rounded hover:bg-blue-700 cursor-pointer"
            
            (click)="seleccionarMarca(marca)">
                {{marca}}
            </button>
        </li>
    </ul>
</div>
