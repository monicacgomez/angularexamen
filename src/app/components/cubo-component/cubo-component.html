<div class="cubo-card">

  <!-- Imagen del cubo -->
  <img [src]="cubo.imagen"
       [alt]="cubo.nombre"
       class="cubo-imagen">

  <!-- Nombre -->
  <h2 class="cubo-titulo">
    {{cubo.nombre}}
  </h2>

  <!-- Información -->
  <p class="cubo-info">
    Modelo: {{cubo.modelo}}
  </p>

  <p class="cubo-info">
    Marca: {{cubo.marca}}
  </p>

  <p class="cubo-info">
    Color: {{cubo.color}}
  </p>

  <!-- Precio -->
  <p class="cubo-precio">
    {{cubo.precio}} €
  </p>

</div>
